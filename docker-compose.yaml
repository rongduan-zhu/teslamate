services:
  teslamate:
    build:
      context: .
      dockerfile: Dockerfile
    image: teslamate/teslamate:local
    restart: always
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      - DATABASE_USER=neondb_owner
      - DATABASE_PASS=${DATABASE_PASS:?Set DATABASE_PASS in .env}
      - DATABASE_NAME=neondb
      - DATABASE_HOST=ep-super-dawn-af3eu8d5-pooler.c-2.us-west-2.aws.neon.tech
      - DATABASE_SSL=noverify
      - DATABASE_SSL_SNI=ep-super-dawn-af3eu8d5-pooler.c-2.us-west-2.aws.neon.tech
      - MQTT_HOST=mosquitto
    ports:
      - 4000:4000
    volumes:
      - ./import:/opt/app/import
    cap_drop:
      - all

  grafana:
    image: teslamate/grafana:latest
    restart: always
    environment:
      - DATABASE_USER=neondb_owner
      - DATABASE_PASS=${DATABASE_PASS:?Set DATABASE_PASS in .env}
      - DATABASE_NAME=neondb
      - DATABASE_HOST=ep-super-dawn-af3eu8d5-pooler.c-2.us-west-2.aws.neon.tech
      - DATABASE_SSL_MODE=require
      - DATABASE_SSL_SNI=ep-super-dawn-af3eu8d5-pooler.c-2.us-west-2.aws.neon.tech
    ports:
      - 3000:3000
    volumes:
      - teslamate-grafana-data:/var/lib/grafana
      - ./grafana-datasource-override.yml:/etc/grafana/provisioning/datasources/datasource.yml

  nextjs-drives:
    image: node:22-alpine
    restart: always
    working_dir: /app
    environment:
      - TESLAMATE_API_URL=http://teslamate:4000/api
      - NEXT_TELEMETRY_DISABLED=1
    command: sh -c "npm install --no-package-lock && npm run dev -- -H 0.0.0.0"
    ports:
      - 3001:3000
    volumes:
      - ./nextjs-drives:/app
      - nextjs-drives-node-modules:/app/node_modules
    depends_on:
      - teslamate

  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    command: mosquitto -c /mosquitto-no-auth.conf
    # ports:
    #   - 1883:1883
    volumes:
      - mosquitto-conf:/mosquitto/config
      - mosquitto-data:/mosquitto/data

volumes:
  # teslamate-db:
  teslamate-grafana-data:
  nextjs-drives-node-modules:
  mosquitto-conf:
  mosquitto-data:
